services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    network_mode: host
    command:
      - sh
      - -c
      - uv run --no-dev python manage.py migrate --noinput && exec uv run --no-dev gunicorn config.wsgi:application --bind 127.0.0.1:41000 --workers 1 --threads 4 --timeout 30 --access-logfile - --error-logfile -
    volumes:
      - ./var:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:41000/v2/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
